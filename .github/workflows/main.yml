name: Auto Update CricHD Events

on:
  schedule:
    # প্রতি ৫ মিনিট পর পর চেক করবে
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: sync-crichd
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch Latest Playlist (Cache Bypass)
        run: |
          TIMESTAMP=$(date +%s)
          # ফাইল ডাউনলোড এবং সাইজ ভ্যালিডেশন
          curl -f -H "Cache-Control: no-cache" -sL "https://raw.githubusercontent.com/srhady/crichd-speical-live-event/main/playlist.m3u?t=${TIMESTAMP}" -o playlist.m3u

          # ফাইলের সাইজ চেক (ফাইল যেন শূন্য বাইট বা নষ্ট না থাকে)
          if [ ! -s playlist.m3u ]; then
            echo "Error: Empty or corrupted playlist downloaded."
            exit 1
          fi

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add playlist.m3u
          if git diff --staged --quiet; then
            echo "No updates detected in the source."
          else
            git commit -m "Auto update CricHD: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            git push origin main
          fi
